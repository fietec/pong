<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Launcher</title>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .settings-card {
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
            width: 320px;
            text-align: center;
        }

        h1 { margin-bottom: 1.5rem; color: #ff4444; letter-spacing: 2px; }

        .field { margin-bottom: 1.2rem; text-align: left; }
        
        label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 5px; }

        input[type="number"], select {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
        }

        select:focus, input:focus { border-color: #ff4444; }

        .play-btn {
            width: 100%;
            margin-top: 1.5rem;
            background: #ff4444;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }

        .play-btn:hover { background: #ff6666; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="settings-card">
        <h1>PONG</h1>
        
        <!-- <div class="field"> -->
        <!--     <label>Game Mode</label> -->
        <!--     <select id="mode"> -->
        <!--         <option value="single">Singleplayer (Wall)</option> -->
        <!--         <option value="computer">VS Computer (AI)</option> -->
        <!--         <option value="multi">Multiplayer (Local)</option> -->
        <!--     </select> -->
        <!-- </div> -->
		<!-- Game Mode -->
		<div class="field">
		  <label>Game Mode (single, computer, multi)</label>
		  <select id="mode">
			<option value="single" selected>Singleplayer</option>
			<option value="computer">Computer</option>
			<option value="multi">Multiplayer</option>
		  </select>
		</div>

		<!-- Winning Score -->
		<div class="field">
		  <label>Winning Score (0 for infinite)</label>
		  <input type="number" id="max-score" value="0" min="0">
		</div>

		<!-- Player Speed -->
		<div class="field">
		  <label>Player Speed (100.0-2000.0)</label>
		  <input type="number" id="player-speed" value="500" min="100" max="2000" step="10">
		</div>

		<!-- Player Speedup -->
		<div class="field">
		  <label>Player Speedup Factor (0.0-2.0)</label>
		  <input type="number" id="player-speedup" value="1" min="0" max="2" step="0.01">
		</div>

		<!-- Player Max Speed -->
		<div class="field">
		  <label>Player Max Speed (100.0-2000.0)</label>
		  <input type="number" id="player-max-speed" value="1000" min="100" max="2000" step="10">
		</div>

		<!-- Player Slippiness -->
		<div class="field">
		  <label>Player Slippiness (100.0-2000.0)</label>
		  <input type="number" id="player-slippiness" value="500" min="100" max="2000" step="10">
		</div>

		<!-- Ball Speed -->
		<div class="field">
		  <label>Initial Ball Speed (100.0-2400.0)</label>
		  <input type="number" id="ball-speed" value="800" min="100" max="2400" step="10">
		</div>

		<!-- Ball Speedup -->
		<div class="field">
		  <label>Ball Speedup Factor (0.0-2.0)</label>
		  <input type="number" id="ball-speedup" value="1.05" min="0" max="2" step="0.01">
		</div>

		<!-- Ball Max Speed -->
		<div class="field">
		  <label>Maximum Ball Speed (100.0-2400.0)</label>
		  <input type="number" id="ball-max-speed" value="1200" min="100" max="2400" step="10">
		</div>
        <button class="play-btn" onclick="start()">PLAY GAME</button>
    </div>

    <script>
      function start() {
		  const mode = document.getElementById('mode').value;
		  const score = document.getElementById('max-score').value;
		  const playerSpeed = document.getElementById('player-speed').value;
		  const playerSpeedup = document.getElementById('player-speedup').value;
		  const playerMaxSpeed = document.getElementById('player-max-speed').value;
		  const playerSlippiness = document.getElementById('player-slippiness').value;
		  const ballSpeed = document.getElementById('ball-speed').value;
		  const ballSpeedup = document.getElementById('ball-speedup').value;
		  const ballMaxSpeed = document.getElementById('ball-max-speed').value;

		  let params = new URLSearchParams();
		  params.append('mode', mode);
		  params.append('max-score', score);
		  params.append('player-speed', playerSpeed);
		  params.append('player-speedup', playerSpeedup);
		  params.append('player-max-speed', playerMaxSpeed);
		  params.append('player-slippiness', playerSlippiness);
		  params.append('ball-speed', ballSpeed);
		  params.append('ball-speedup', ballSpeedup);
		  params.append('ball-max-speed', ballMaxSpeed);

		  window.location.href = `./game.html?${params.toString()}`;
        }
    </script>
</body>
</html>
